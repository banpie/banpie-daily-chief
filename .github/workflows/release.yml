name: 发布制品

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: 验证 Codex 市场安装
        shell: bash
        run: |
          export CODEX_HOME="$RUNNER_TEMP/codex-home"
          mkdir -p "$CODEX_HOME"
          npx --yes @openai/codex@0.151.0 plugin marketplace add "$GITHUB_WORKSPACE" --json
          npx --yes @openai/codex@0.151.0 plugin add banpie-daily-chief@banpie --json
      - name: WorkBuddy 正式客户端兼容验证
        run: npx --yes --package=@tencent-ai/codebuddy-code@2.115.0 codebuddy plugin validate plugins/workbuddy/banpie-daily-chief
      - name: WorkBuddy 当前校验器验证插件与市场
        run: |
          npx --yes --package=@tencent-ai/codebuddy-code@2.142.0 codebuddy plugin validate plugins/workbuddy/banpie-daily-chief
          npx --yes --package=@tencent-ai/codebuddy-code@2.142.0 codebuddy plugin validate .codebuddy-plugin/marketplace.json

  runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            node: 22
            label: macos-arm64
          - os: macos-15-intel
            node: 22
            label: macos-x64
          - os: windows-latest
            node: 22
            label: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/build-runtime.mjs
      - run: npm run verify:installer
      - uses: actions/upload-artifact@v6
        with:
          name: runtime-${{ matrix.label }}
          path: release/banpie-daily-chief-runtime-*.zip
          if-no-files-found: error

  release:
    needs: [validation, runtime]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/download-artifact@v7
        with:
          pattern: runtime-*
          path: release
          merge-multiple: true
      - run: npm run package:release
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
          files: |
            release/*.zip
            release/SHA256SUMS

  publish-npm:
    needs: [validation, runtime, release]
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - name: 校验稳定标签与包版本
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const tag = process.env.GITHUB_REF_NAME;
          const match = /^v(\d+\.\d+\.\d+)$/.exec(tag);
          if (!match) throw new Error(`npm 只接受稳定语义化标签，当前为 ${tag}`);

          for (const path of ["packages/core/package.json", "packages/cli/package.json"]) {
            const pkg = JSON.parse(readFileSync(path, "utf8"));
            if (pkg.version !== match[1]) {
              throw new Error(`${pkg.name} 版本 ${pkg.version} 与标签 ${tag} 不一致`);
            }
          }
          NODE
      - name: 发布公共核心包
        run: npm publish -w @banpie/daily-chief-core --access public
      - name: 发布命令行包
        run: npm publish -w @banpie/daily-chief-cli --access public
