name: 持续集成

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check

  browser:
    name: 中英双语浏览器验收
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  plugins:
    name: 双宿主插件验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - name: Codex 市场摄取与安装
        shell: bash
        run: |
          export CODEX_HOME="$RUNNER_TEMP/codex-home"
          npx --yes @openai/codex@0.151.0 plugin marketplace add "$GITHUB_WORKSPACE" --json
          npx --yes @openai/codex@0.151.0 plugin add banpie-daily-chief@banpie --json
      - run: npx --yes @tencent-ai/codebuddy-code@2.115.0 plugin validate plugins/workbuddy/banpie-daily-chief
      - run: npx --yes @tencent-ai/codebuddy-code@2.115.0 plugin validate .codebuddy-plugin/marketplace.json

  runtime:
    name: ${{ matrix.label }} 预构建运行时
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS arm64
          - os: macos-13
            label: macOS x64
          - os: windows-latest
            label: Windows x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/build-runtime.mjs
      - run: npm run verify:installer
      - uses: actions/upload-artifact@v6
        with:
          name: runtime-${{ runner.os }}-${{ runner.arch }}
          path: release/banpie-daily-chief-runtime-*.zip
          if-no-files-found: error
